<html lang="ar" dir="rtl">

<style>
:root{font-family:"Atkinson Hyperlegible Next","Segoe UI",Tahoma,Arial,sans-serif;color:#36243b;background:#f7f3eb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
header{position:relative;z-index:1;background:#fffdfa;border-bottom:1px solid #eadfe7;box-shadow:0 3px 12px #33213a09}
.bar{width:min(100%,1200px);margin:auto;display:flex;align-items:center;gap:clamp(14px,4vw,48px);padding:9px 22px}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:1.16rem;font-weight:800}
.mark{display:grid;place-items:center;width:33px;height:33px;border-radius:10px;background:#4a2a51;color:#f2d2a6}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{color:#563b59;font-size:.92rem;font-weight:700;border-radius:9px;text-decoration:none;padding:8px 12px;white-space:nowrap}
nav a[aria-current="page"]{color:#fff;background:#4a2a51}
nav a:not([aria-current]):hover{background:#f2e9f2}
nav a:focus-visible{outline:2px solid #8c4872;outline-offset:2px}
main{min-height:0}
iframe{display:block;width:100%;height:100%;border:0}
iframe[hidden]{display:none}
noscript{display:block;padding:16px}
@media(max-width:420px){.bar{padding-inline:10px;gap:9px}.brand{font-size:1rem}.mark{width:27px;height:27px}nav{gap:2px}nav a{font-size:.79rem;padding:8px}}
.sync-bar{position:relative;z-index:3;display:flex;align-items:center;gap:12px;padding:8px clamp(12px,3vw,24px);background:#fffdfa;border-bottom:1px solid #eadfe7;font-size:14px;box-shadow:0 3px 12px #33213a08}.sync-bar>span{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-weight:700;line-height:1.45}.sync-bar>span::before{content:"";width:9px;height:9px;flex:none;border-radius:50%;background:#a77a2e;box-shadow:0 0 0 3px #a77a2e1f}.sync-menu{position:relative;flex:none}.sync-menu summary{display:flex;align-items:center;gap:7px;min-height:36px;border:1px solid #dacddd;background:#fff;color:#4a2a51;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer;list-style:none}.sync-menu summary::-webkit-details-marker{display:none}.sync-menu summary::after{content:"⌄";font-size:1rem;line-height:1;transition:transform .15s}.sync-menu[open] summary::after{transform:rotate(180deg)}.sync-menu summary:hover{background:#f5edf5;border-color:#bda9c0}.sync-menu summary:focus-visible,.sync-bar button:focus-visible{outline:2px solid #8c4872;outline-offset:2px}.sync-actions{position:absolute;top:calc(100% + 7px);inset-inline-end:0;width:min(290px,calc(100vw - 24px));display:grid;gap:6px;padding:8px;background:#fffdfa;border:1px solid #dfd3df;border-radius:12px;box-shadow:0 14px 35px #33213a24}.sync-bar button{display:flex;align-items:center;justify-content:flex-start;width:100%;min-height:38px;font:inherit;font-weight:700;line-height:1.25;border:0;background:transparent;color:#4a2a51;border-radius:8px;padding:9px 11px;text-align:start;cursor:pointer}.sync-bar button:hover{background:#f3eaf3}.sync-bar button:active{transform:translateY(1px)}.sync-bar [data-state="saved"]{color:#245c49}.sync-bar [data-state="saved"]::before{background:#2f7a60;box-shadow:0 0 0 3px #2f7a601f}.sync-bar [data-state="error"]{color:#9f3844}.sync-bar [data-state="error"]::before{background:#b34350;box-shadow:0 0 0 3px #b343501f}.sync-bar [hidden]{display:none!important}@media(max-width:520px){.sync-bar{padding-block:7px}.sync-bar>span{font-size:12px}.sync-menu summary{min-height:34px;padding:7px 9px;font-size:12px}}</style>
</head>
<body>
<header><div class="bar">
 <div class="brand"><span class="mark" aria-hidden="true">د</span>دلال</div>

 </nav>
</div></header>

  </div>
 </details>
</section><main>
 <iframe id="project" title="لوحة مشروع دلال" hidden></iframe>

</main>
<script type="application/json" id="pages">{"project":"\u003c!doctype html>\n\u003chtml lang=\"ar\" dir=\"rtl\">\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>دلال | لوحة المشروع\u003c/title>\n\u003cstyle>\n:root{color-scheme:light;--paper:#f7f3eb;--card:#fffdfa;--ink:#2c2130;--muted:#625763;--line:#e7dfe3;--plum:#4a2a51;--gold:#f2d2a6;--green:#245c49;--red:#9f3844}\n*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 \"Kantumruy Pro\",system-ui,Tahoma,sans-serif}\nh1,h2,h3,p{margin:0}a{color:var(--plum)}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:3px}button{cursor:pointer}\n.wrap{max-width:1120px;margin:auto;padding-inline:24px}\nheader{background:var(--card);border-bottom:1px solid var(--line)}header .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:14px}\n.brand{font-size:1.35rem;font-weight:800;color:var(--plum);display:flex;gap:9px;align-items:center}.brand-mark{display:grid;place-items:center;background:var(--plum);color:var(--gold);width:34px;height:34px;border-radius:11px;font-size:1.1rem}\nnav{display:flex;gap:20px;flex-wrap:wrap}nav a{text-decoration:none;font-size:.87rem;font-weight:700}\nmain{padding-block:24px 40px}.hero{background:linear-gradient(120deg,#412448,#61385f);color:#fffaf5;border-radius:24px;padding:28px;display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center}\nh1{font-size:clamp(2rem,5vw,3.3rem);line-height:1.2}.hero p{color:#f3e1ee;margin-top:8px}.hero .summary{display:flex;align-items:center;gap:15px;background:#ffffff12;border:1px solid #ffffff32;border-radius:16px;padding:15px 18px}.progress-circle{width:91px;height:91px;flex:none;display:grid;place-items:center;position:relative;color:var(--gold)}.progress-circle svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}.progress-track{stroke:#ffffff35}.progress-arc{stroke:var(--gold);stroke-linecap:round;transition:stroke-dasharray .2s ease}.percent{font-size:1.32rem;font-weight:800}.hero-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.hero-title .quiet{background:#ffffff14;border-color:#ffffff60;color:white}.group-buttons,.heading-buttons{display:flex;gap:6px;flex-wrap:wrap}.next-text{flex:1;min-width:0;overflow-wrap:anywhere}.next-list .row{align-items:start}.next-list .quiet{padding-inline:7px}@media(prefers-reduced-motion:reduce){.progress-arc{transition:none}}\n.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:20px;align-items:start;margin-top:20px}.stack{display:grid;gap:18px;min-width:0}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px 19px;min-width:0}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.heading h2{font-size:1.23rem}.heading h3{font-size:1.05rem}.muted,small{color:var(--muted)}small{display:block}.quiet,.primary{border:1px solid var(--line);background:#fff;color:var(--plum);padding:6px 10px;border-radius:8px;font-weight:650;font-size:.86rem;flex-shrink:0}.primary{background:var(--plum);border-color:var(--plum);color:white}.danger{color:var(--red)}\n.group{overflow:hidden;padding:0}.group .heading{padding:13px 16px;margin:0;background:#f4edf4}.group .sub{padding:9px 16px 0;font-size:.84rem}.group ul,.next-list,.notes{margin:0;padding:0;list-style:none}.row{display:flex;align-items:start;gap:9px;padding:10px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.group .row{padding-inline:16px}.row input[type=checkbox]{margin-top:5px;width:18px;height:18px;accent-color:var(--green);flex-shrink:0}.task-text{flex:1;min-width:0;overflow-wrap:anywhere}.task-text label{cursor:pointer}.row.complete .task-text label{color:var(--muted);text-decoration:line-through}.detail{font-size:.83rem;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}.next-list li{padding:8px 0;border-top:1px solid var(--line)}.next-list li:first-child{border:0}.next-list a{font-weight:700;text-decoration:none}.empty{padding:10px 0;color:var(--muted)}\n.budget-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.money{padding:9px;background:#f5eff5;border-radius:10px;min-width:0}.money strong{display:block;font-size:1rem;overflow-wrap:anywhere}.money.over{background:#f9e8e9;color:var(--red)}.budget-list{margin-top:12px}.budget-list .row .detail{white-space:normal}.notes li p{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}\nfooter{border-top:1px solid var(--line);margin-top:20px;padding-top:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}footer small{flex:1;min-width:230px}#message{margin-top:10px;color:var(--red)}\ndialog{color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:17px;width:min(460px,calc(100% - 28px));padding:19px;box-shadow:0 18px 70px #28102d4d}dialog::backdrop{background:#2b183963}form{display:grid;gap:10px}form label{display:grid;gap:4px;font-weight:650}form input,form textarea,form select{width:100%;min-width:0;border:1px solid #cbbfcb;border-radius:8px;background:white;color:var(--ink);padding:7px 9px}textarea{min-height:95px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .danger{margin-inline-start:auto}[hidden]{display:none!important}\n@media(max-width:740px){.wrap{padding-inline:13px}.layout,.hero{grid-template-columns:1fr}.hero{gap:18px;padding:19px}header .wrap{flex-wrap:wrap}.card{padding:14px}.group{padding:0}nav{gap:13px}}\n\u003c/style>\n\u003cheader>\u003cdiv class=\"wrap\">\u003cdiv class=\"brand\">\u003cspan class=\"brand-mark\" aria-hidden=\"true\">د\u003c/span>دلال\u003c/div>\u003cnav aria-label=\"أقسام اللوحة\">\u003ca href=\"#tasks\">المهام\u003c/a>\u003ca href=\"#budget\">الميزانية\u003c/a>\u003ca href=\"#notes\">الملاحظات\u003c/a>\u003c/nav>\u003c/div>\u003c/header>\n\u003cmain class=\"wrap\">\n\u003csection class=\"hero\">\u003cdiv>\u003cdiv class=\"hero-title\">\u003ch1 id=\"project-title\">لوحة مشروع دلال\u003c/h1>\u003cbutton class=\"quiet\" id=\"edit-title\">تعديل العنوان\u003c/button>\u003c/div>\u003cp>المهام، التعديلات والمصروفات في مكان واحد.\u003c/p>\u003c/div>\n\u003cdiv class=\"summary\">\u003cdiv class=\"progress-circle\" id=\"progress\" role=\"progressbar\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"0\" aria-label=\"تقدّم المهام\">\u003csvg viewBox=\"0 0 80 80\" aria-hidden=\"true\" fill=\"none\" stroke-width=\"7\">\u003ccircle class=\"progress-track\" cx=\"40\" cy=\"40\" r=\"34\"/>\u003ccircle id=\"progress-arc\" class=\"progress-arc\" cx=\"40\" cy=\"40\" r=\"34\" pathLength=\"100\" stroke-dasharray=\"0 100\"/>\u003c/svg>\u003cspan id=\"percent\" class=\"percent\">\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>تقدّم المهام\u003c/strong>\u003cp id=\"progress-text\" aria-live=\"polite\">\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n\u003cdiv class=\"layout\">\n\u003csection id=\"tasks\" class=\"stack\" aria-labelledby=\"tasks-title\">\u003cdiv class=\"heading\">\u003ch2 id=\"tasks-title\">مهام المشروع\u003c/h2>\u003cdiv class=\"heading-buttons\">\u003cbutton class=\"quiet\" id=\"add-section\">إضافة قائمة\u003c/button>\u003cbutton class=\"primary\" id=\"add-task\">إضافة مهمة\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"stack\" id=\"groups\">\u003c/div>\u003c/section>\n\u003caside class=\"stack\">\n\u003csection class=\"card\" aria-labelledby=\"next-title\">\u003cdiv class=\"heading\">\u003ch2 id=\"next-title\">الخطوات القادمة\u003c/h2>\u003cdiv class=\"heading-buttons\">\u003cbutton class=\"quiet\" id=\"edit-next-title\" aria-label=\"تعديل عنوان الخطوات القادمة\">تعديل العنوان\u003c/button>\u003cbutton class=\"primary\" id=\"add-step\">إضافة خطوة\u003c/button>\u003c/div>\u003c/div>\u003cul id=\"next\" class=\"next-list\">\u003c/ul>\u003c/section>\n\u003csection class=\"card\" id=\"budget\">\u003cdiv class=\"heading\">\u003ch2>ميزانية المشروع\u003c/h2>\u003cbutton class=\"quiet\" id=\"edit-cap\">تحديد السقف\u003c/button>\u003c/div>\n\u003cdiv id=\"budget-stats\" class=\"budget-stats\">\u003c/div>\u003csmall>الأرقام بالريال السعودي. أدخلي التكلفة التقديرية وما دفعتيه لكل بند.\u003c/small>\n\u003cdiv id=\"budget-list\" class=\"budget-list\">\u003c/div>\u003cbutton class=\"quiet\" id=\"add-cost\">إضافة بند\u003c/button>\u003c/section>\n\u003csection class=\"card\" id=\"notes\">\u003cdiv class=\"heading\">\u003ch2>الملاحظات\u003c/h2>\u003cbutton class=\"quiet\" id=\"add-note\">إضافة ملاحظة\u003c/button>\u003c/div>\u003cul id=\"notes-list\" class=\"notes\">\u003c/ul>\u003c/section>\n\u003c/aside>\n\u003c/div>\n\u003cfooter>\u003csmall>الحفظ مشترك للجميع. حالة الاتصال والحفظ تظهر في الشريط العلوي.\u003c/small>\u003cbutton class=\"quiet\" id=\"backup\">حفظ نسخة احتياطية\u003c/button>\u003cbutton class=\"quiet\" id=\"restore\">استعادة نسخة\u003c/button>\u003cinput id=\"backup-file\" type=\"file\" accept=\".json,application/json\" hidden>\u003c/footer>\n\u003cp id=\"message\" role=\"status\">\u003c/p>\n\u003c/main>\n\u003cdialog id=\"editor\" aria-labelledby=\"form-title\">\u003cform id=\"form\">\u003ch2 id=\"form-title\">\u003c/h2>\u003cdiv id=\"fields\" class=\"stack\">\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\">حفظ\u003c/button>\u003cbutton id=\"cancel\" class=\"quiet\" type=\"button\">إلغاء\u003c/button>\u003cbutton id=\"remove\" class=\"quiet danger\" type=\"button\">حذف\u003c/button>\u003c/div>\u003c/form>\u003c/dialog>\n\u003cscript>\n'use strict';\nconst defaultSections = [\n  {id:'license', title:'الرخصة', link:'https://business.sa/', linkText:'المركز السعودي للأعمال'},\n  {id:'ip', title:'الملكية الفكرية', link:'https://www.saip.gov.sa/ar/services/trademarks/trademark-registration', linkText:'خدمة تسجيل العلامة التجارية'},\n  {id:'web', title:'تعديلات الموقع'},\n  {id:'data', title:'بيانات الأماكن ومراجعتها'},\n];\nconst seeds = [\n ['license','تحديد النشاط وطريقة التشغيل','اكتبي كيف يعمل دلال وكيف يحقق دخلًا إن كان له نموذج ربحي.',true,false],\n ['license','التحقق من الترخيص المناسب لدلال','استفسري عن المتطلبات حسب النشاط وسجّلي المستندات والرسوم في اللوحة.',false,false],\n ['license','تجهيز المستندات وتقديم الطلب','بعد تحديد المتطلبات، سجّلي رقم الطلب وتابعيه.',false,false],\n ['ip','البحث عن اسم «دلال» والشعار','راجعي الأسماء والعلامات المشابهة قبل تقديم الطلب.',true,false],\n ['ip','تجهيز ملفات العلامة وتحديد فئة التسجيل','حددي نطاق الحماية المطلوب وراجعي رسوم التقديم قبل الدفع.',false,false],\n ['ip','تقديم الطلب ومتابعته','سجّلي رقم الطلب وأي مواعيد أو ملاحظات من الجهة.',false,false],\n ['web','نشر موقع دلال على GitHub Pages','',false,true],\n ['web','اختبار الموقع على الجوال والكمبيوتر','افحصي البحث والفئات والخريطة من نسخة الموقع المنشورة.',true,false],\n ['web','إضافة الفئات الفرعية إلى الموقع','ابدئي بالمطاعم والمقاهي، ثم اختبري ظهور الفئات في البحث.',false,false],\n ['web','تجربة الاستيراد بعينة من الأماكن','اختبري إضافة الأماكن ومراجعتها وظهورها في التطبيق.',false,false],\n ['web','عرض بيانات التواصل والصور','راجعي عرض الهاتف والإيميل ورابط الموقع وصورة المكان.',false,false],\n ['data','تجهيز صفحة مراجعة الأماكن','الصفحة تشمل البحث والتعديل وعمودي «تم» و«المراجع».',false,true],\n ['data','توزيع أول دفعة للمراجعة','حددي المراجع لكل مكان واختاري عينة صغيرة من المطاعم والمقاهي.',false,false],\n ['data','التحقق من بيانات أول دفعة','راجعي الاسم والفئة ورابط الخريطة والتواصل عند توفره.',false,false],\n];\nconst initial = {\n  sections:defaultSections, titles:{project:'لوحة مشروع دلال',next:'الخطوات القادمة'}, steps:[],\n  tasks:seeds.map(([section,title,detail,priority,done],i)=>({id:'t'+i,section,title,detail,priority,done})),\n  cap:null,\n  costs:['الرخصة والإجراءات','الملكية الفكرية','النطاق والاستضافة','الخريطة والبحث','تطوير الموقع','جمع البيانات ومراجعتها'].map((title,i)=>({id:'c'+i,title,estimate:null,paid:null})),\n  notes:[],\n};\nconst key='dalal-project-board-v1';\nconst $=id=>document.getElementById(id);\nconst el=(tag,text,cls)=>{\n  const item=document.createElement(tag);\n  if(text!==undefined)item.textContent=text;\n  if(cls)item.className=cls;\n  return item;\n};\nconst money=new Intl.NumberFormat('ar-SA',{style:'currency',currency:'SAR',maximumFractionDigits:2});\nconst num=new Intl.NumberFormat('ar-SA');\nconst percentFormat=new Intl.NumberFormat('ar-SA',{style:'percent',maximumFractionDigits:0});\nconst format=value=>value===null?'—':money.format(value);\nconst amount=value=>value===''?null:Number(value);\nconst validAmount=value=>value===null||(typeof value==='number'&&Number.isFinite(value)&&value>=0&&value\u003c=1000000000);\nconst makeId=()=>globalThis.crypto?.randomUUID?.()??('id-'+Date.now()+'-'+Math.random().toString(36).slice(2));\nconst idPattern=/^[a-zA-Z0-9-]+$/;\nconst uniqueIds=items=>new Set(items.map(item=>item.id)).size===items.length;\nfunction isBoard(board){\n  const entry=item=>item&&typeof item==='object'&&typeof item.id==='string'&&idPattern.test(item.id);\n  if(!board||typeof board!=='object')return false;\n  const sections=board.sections===undefined?defaultSections:board.sections;\n  const titles=board.titles===undefined?initial.titles:board.titles;\n  const steps=board.steps===undefined?initial.steps:board.steps;\n  const validLink=link=>link===undefined||(typeof link==='string'&&/^https:\\/\\//i.test(link));\n  return Array.isArray(sections)&&sections.length>0&&sections.every(s=>entry(s)&&typeof s.title==='string'&&validLink(s.link)&&(s.link===undefined||typeof s.linkText==='string'))&&uniqueIds(sections)\n    &&titles&&typeof titles.project==='string'&&typeof titles.next==='string'\n    &&Array.isArray(steps)&&steps.every(s=>entry(s)&&typeof s.title==='string')&&uniqueIds(steps)\n    &&validAmount(board.cap)\n    &&Array.isArray(board.tasks)&&board.tasks.every(t=>entry(t)&&sections.some(s=>s.id===t.section)&&typeof t.title==='string'&&typeof t.detail==='string'&&typeof t.priority==='boolean'&&typeof t.done==='boolean')&&uniqueIds(board.tasks)\n    &&Array.isArray(board.costs)&&board.costs.every(c=>entry(c)&&typeof c.title==='string'&&validAmount(c.estimate)&&validAmount(c.paid))&&uniqueIds(board.costs)\n    &&Array.isArray(board.notes)&&board.notes.every(n=>entry(n)&&typeof n.text==='string')&&uniqueIds(board.notes);\n}\nlet state=structuredClone(initial);\nfunction loadBoard(board){\n  return {...structuredClone(initial),...board};\n}\ntry{\n  const saved=JSON.parse(localStorage.getItem(key));\n  if(isBoard(saved))state=loadBoard(saved);\n}catch{\n  $('message').textContent='تعذّرت قراءة التعديلات المحفوظة. يمكنك استعادتها من نسخة احتياطية.';\n}\nlet cloudBase=structuredClone(state);\nfunction persist(){\n  try{parent.dalalSync.save(key,cloudBase,state,'project');cloudBase=structuredClone(state);$('message').textContent='التعديل ينتظر تأكيد الحفظ في الشريط العلوي.';}\n  catch{$('message').textContent='تعذّر الحفظ في المتصفح. احفظي نسخة احتياطية قبل إغلاق الصفحة.';}\n}\nfunction button(label,fn,description){\n  const control=el('button',label,'quiet');\n  control.type='button';\n  if(description)control.setAttribute('aria-label',description);\n  control.addEventListener('click',fn);\n  return control;\n}\nfunction renderTasks(){\n  const done=state.tasks.filter(t=>t.done).length;\n  const fraction=state.tasks.length?done/state.tasks.length:0;\n  $('percent').textContent=percentFormat.format(fraction);\n  const percentage=Math.round(fraction*100);\n  $('progress').setAttribute('aria-valuenow',percentage);\n  $('progress-arc').setAttribute('stroke-dasharray',percentage+' 100');\n  $('progress-arc').style.visibility=percentage?'visible':'hidden';\n  $('progress-text').textContent=num.format(done)+' من '+num.format(state.tasks.length)+' مهمة مكتملة';\n  $('groups').replaceChildren();\n  for(const s of state.sections){\n    const card=el('section',undefined,'card group');\n    card.id=s.id;\n    const head=el('div',undefined,'heading');\n    const buttons=el('div',undefined,'group-buttons');\n    buttons.append(button('تعديل القائمة',()=>edit('section',s),'تعديل قائمة '+s.title),button('إضافة',()=>edit('task',{section:s.id}),'إضافة مهمة إلى '+s.title));\n    head.append(el('h3',s.title),buttons);\n    card.append(head);\n    if(s.link){\n      const sub=el('p',undefined,'sub'), link=el('a',s.linkText);\n      link.href=s.link;link.target='_blank';link.rel='noopener noreferrer';\n      sub.append(link);card.append(sub);\n    }\n    const list=el('ul');\n    const tasks=state.tasks.filter(t=>t.section===s.id);\n    for(const t of tasks){\n      const row=el('li',undefined,t.done?'row complete':'row');\n      const box=el('input');\n      box.type='checkbox';box.id='task-'+t.id;box.checked=t.done;\n      box.addEventListener('change',()=>{t.done=box.checked;saveAndRender();$(box.id)?.focus();});\n      const text=el('div',undefined,'task-text'), label=el('label',t.title);\n      label.htmlFor=box.id;text.append(label);\n      if(t.detail)text.append(el('p',t.detail,'detail'));\n      row.append(box,text,button('تعديل',()=>edit('task',t),'تعديل '+t.title));list.append(row);\n    }\n    if(!tasks.length)list.append(el('li','لا توجد مهام في هذا القسم.','row muted'));\n    card.append(list);$('groups').append(card);\n  }\n}\nfunction renderSteps(){\n  const list=$('next');\n  list.replaceChildren();\n  for(const step of state.steps){\n    const row=el('li',undefined,'row');\n    row.append(el('span',step.title,'next-text'),button('تعديل',()=>edit('step',step),'تعديل خطوة '+step.title),button('حذف',()=>removeStep(step.id),'حذف خطوة '+step.title));\n    list.append(row);\n  }\n  for(const task of state.tasks.filter(t=>!t.done&&t.priority)){\n    const row=el('li',undefined,'row'), text=el('div',undefined,'next-text'),link=el('a',task.title);\n    link.href='#task-'+task.id;\n    link.addEventListener('click',()=> $('task-'+task.id)?.focus());\n    text.append(link,el('small',state.sections.find(s=>s.id===task.section).title));\n    row.append(text,button('حذف',()=>{\n      task.priority=false;\n      saveAndRender();\n    },'حذف خطوة '+task.title));\n    list.append(row);\n  }\n  if(!list.childElementCount)list.append(el('li','أضيفي الخطوة اللي تبين تبدئين فيها.','empty'));\n}\nfunction removeStep(id){\n  state.steps=state.steps.filter(step=>step.id!==id);\n  saveAndRender();\n  $('add-step').focus();\n}\nfunction total(field){\n  if(!state.costs.some(item=>item[field]!==null))return null;\n  return Math.round(state.costs.reduce((sum,item)=>sum+(item[field]??0),0)*100)/100;\n}\nfunction renderBudget(){\n  const spent=total('paid'), estimate=total('estimate');\n  const remaining=state.cap===null?null:Math.round((state.cap-(spent??0))*100)/100;\n  $('edit-cap').textContent=state.cap===null?'تحديد السقف':'تعديل السقف';\n  $('budget-stats').replaceChildren();\n  for(const [label,value] of [['سقف الميزانية',state.cap],['الإجمالي التقديري',estimate],['المدفوع المسجّل',spent],['المتبقي من السقف',remaining]]){\n    const card=el('div',undefined,value\u003c0?'money over':'money');\n    card.append(el('small',label),el('strong',format(value)));$('budget-stats').append(card);\n  }\n  $('budget-list').replaceChildren();\n  for(const cost of state.costs){\n    const row=el('div',undefined,'row'), text=el('div',undefined,'task-text');\n    text.append(el('strong',cost.title),el('p','التقدير '+format(cost.estimate)+' · المدفوع '+format(cost.paid),'detail'));\n    row.append(text,button('تعديل',()=>edit('cost',cost),'تعديل '+cost.title));$('budget-list').append(row);\n  }\n}\nfunction renderNotes(){\n  $('notes-list').replaceChildren();\n  for(const note of state.notes){\n    const row=el('li',undefined,'row');\n    row.append(el('p',note.text),button('تعديل',()=>edit('note',note),'تعديل الملاحظة'));$('notes-list').append(row);\n  }\n  if(!state.notes.length)$('notes-list').append(el('li','أضيفي قرارًا أو فكرة تبين ترجعين لها.','empty'));\n}\nfunction render(){\n  $('project-title').textContent=state.titles.project;\n  $('next-title').textContent=state.titles.next;\n  renderTasks();renderSteps();renderBudget();renderNotes();\n}\nfunction saveAndRender(){persist();render();}\nfunction field(name,label,value,options={}){\n  const wrap=el('label',label);\n  const input=el(options.choices?'select':options.multiline?'textarea':'input');\n  input.name=name;\n  if(options.choices){\n    for(const s of options.choices){\n      const option=el('option',s.title);option.value=s.id;input.append(option);\n    }\n  }else if(options.number){\n    input.type='number';input.min='0';input.max='1000000000';input.step='0.01';\n  }else if(options.multiline){\n    input.maxLength=1500;\n  }else{\n    input.maxLength=150;\n  }\n  input.value=value??'';\n  input.required=Boolean(options.required);\n  wrap.append(input);$('fields').append(wrap);\n}\nlet active=null;\nfunction edit(kind,item={}){\n  active={kind,item};\n  const names={task:'مهمة',note:'ملاحظة',cost:'بند ميزانية',step:'خطوة',section:'قائمة',heading:'عنوان'};\n  $('form-title').textContent=kind==='cap'?'سقف الميزانية':(item.id?'تعديل ':'إضافة ')+names[kind];\n  $('fields').replaceChildren();\n  $('remove').hidden=!item.id||kind==='heading'||(kind==='section'&&state.sections.length===1);\n  if(kind==='heading')field('title','العنوان',state.titles[item.id],{required:true});\n  if(kind==='step')field('title','الخطوة',item.title,{required:true});\n  if(kind==='section'){\n    field('title','اسم القائمة',item.title,{required:true});\n    const hasTasks=item.id&&state.tasks.some(t=>t.section===item.id);\n    const alternatives=state.sections.filter(s=>s.id!==item.id);\n    if(hasTasks&&alternatives.length)field('move-to','نقل المهام إلى هذه القائمة عند الحذف',alternatives[0].id,{choices:alternatives});\n  }\n  if(kind==='task'){\n    field('title','عنوان المهمة',item.title,{required:true});\n    field('section','القائمة',item.section??state.sections[0].id,{choices:state.sections});\n    field('detail','التفاصيل',item.detail,{multiline:true});\n    const label=el('label','إظهارها ضمن الأولويات');\n    const check=el('input');check.type='checkbox';check.name='priority';check.checked=item.priority??false;check.style.width='auto';\n    label.style.display='flex';label.append(check);$('fields').append(label);\n  }\n  if(kind==='cost'){\n    field('title','اسم البند',item.title,{required:true});\n    field('estimate','التقدير بالريال',item.estimate,{number:true});\n    field('paid','المدفوع بالريال',item.paid,{number:true});\n  }\n  if(kind==='note')field('text','الملاحظة',item.text,{multiline:true,required:true});\n  if(kind==='cap')field('cap','السقف بالريال',state.cap,{number:true});\n  $('editor').showModal();\n}\nconst lists={task:'tasks',cost:'costs',note:'notes',step:'steps',section:'sections'};\n$('form').addEventListener('submit',event=>{\n  event.preventDefault();\n  const {kind,item}=active;\n  const data=new FormData(event.currentTarget);\n  const read=name=>String(data.get(name)??'').trim();\n  const required=kind==='cap'?null:kind==='note'?'text':'title';\n  if(required&&!read(required)){\n    const control=event.currentTarget.elements[required];control.value='';control.reportValidity();return;\n  }\n  if(kind==='cap'){\n    state.cap=amount(read('cap'));\n  }else if(kind==='heading'){\n    state.titles[item.id]=read('title');\n  }else{\n    const id=item.id??makeId();\n    const values={\n      task:{section:read('section'),title:read('title'),detail:read('detail'),priority:data.has('priority'),done:item.done??false},\n      cost:{title:read('title'),estimate:amount(read('estimate')),paid:amount(read('paid'))},\n      note:{text:read('text')},\n      step:{title:read('title')},\n      section:{title:read('title')},\n    };\n    const list=state[lists[kind]];\n    if(item.id)Object.assign(item,values[kind]);\n    else list.push({id,...values[kind]});\n  }\n  $('editor').close();saveAndRender();\n});\n$('remove').addEventListener('click',()=>{\n  if(!active?.item.id)return;\n  const {kind,item}=active;\n  if(kind==='section'){\n    if(state.sections.length\u003c=1)return;\n    const tasks=state.tasks.filter(task=>task.section===item.id);\n    const destination=$('form').elements['move-to']?.value;\n    if(tasks.length&&!state.sections.some(s=>s.id!==item.id&&s.id===destination))return;\n    const message=tasks.length?'حذف القائمة ونقل مهامها إلى القائمة المحددة؟':'حذف هذه القائمة؟';\n    if(!confirm(message))return;\n    for(const task of tasks)task.section=destination;\n  }else if(!confirm('حذف هذا العنصر؟'))return;\n  state[lists[kind]]=state[lists[kind]].filter(entry=>entry.id!==item.id);\n  $('editor').close();saveAndRender();\n});\n$('cancel').addEventListener('click',()=> $('editor').close());\n$('add-task').addEventListener('click',()=>edit('task'));\n$('add-section').addEventListener('click',()=>edit('section'));\n$('add-step').addEventListener('click',()=>edit('step'));\n$('edit-title').addEventListener('click',()=>edit('heading',{id:'project'}));\n$('edit-next-title').addEventListener('click',()=>edit('heading',{id:'next'}));\n$('add-cost').addEventListener('click',()=>edit('cost'));\n$('edit-cap').addEventListener('click',()=>edit('cap'));\n$('add-note').addEventListener('click',()=>edit('note'));\n$('backup').addEventListener('click',()=>{\n  const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));\n  const link=el('a');link.href=url;link.download='Dalal-Project-Board-backup.json';\n  document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);\n});\n$('restore').addEventListener('click',()=> $('backup-file').click());\n$('backup-file').addEventListener('change',async event=>{\n  const file=event.target.files[0];event.target.value='';\n  if(!file)return;\n  try{\n    const board=JSON.parse(await file.text());\n    if(!isBoard(board))throw new Error('Invalid backup');\n    if(confirm('استعادة النسخة واستبدال البيانات المعروضة؟')){state=loadBoard(board);saveAndRender();}\n  }catch{$('message').textContent='تعذّرت الاستعادة. اختاري نسخة احتياطية صادرة من لوحة دلال.';}\n});\nrender();\nwindow.dalalReceive=data=>{\n if($('editor').open)return false;\n if(!isBoard(data[key]))return false;\n state=loadBoard(data[key]);cloudBase=structuredClone(state);render();return true;\n};\n\u003c/script>\n\u003c/html>\n","places":"\u003c!doctype html>\n\u003chtml lang=\"ar\" dir=\"rtl\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"color-scheme\" content=\"light\">\n\u003ctitle>دلال | مراجعة أماكن حائل\u003c/title>\n\u003cstyle>\n:root{color-scheme:light;--ink:#241b2d;--muted:#655d6b;--berry:#503052;--berry-dark:#352139;--accent:#8c4872;--page:#f7f4ef;--paper:#fff;--edge:#e7e0e6;--lav:#f3ebf5;--green:#235d48;--amber:#844916;--radius:15px;font-family:\"Atkinson Hyperlegible Next\",\"Segoe UI\",Tahoma,Arial,sans-serif;background:var(--page);color:var(--ink)}\n*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #986398;outline-offset:3px}\nh1,h2,h3,p{margin:0}a{color:var(--berry)}a:hover{text-decoration-thickness:2px}\n.banner{background:linear-gradient(120deg,#3d2743,#754360 86%,#7d4868);color:#fff}\n.banner-inner{max-width:1480px;margin:auto;padding:29px 34px 34px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}\n.brand-line{display:flex;align-items:center;gap:9px;color:#f3dce9;font-weight:700;margin-bottom:8px;font-size:.93rem}.brand-mark{width:11px;height:11px;border:2px solid #f0c3d8;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}\nh1{font-size:clamp(1.75rem,4vw,2.65rem);line-height:1.25;font-weight:750}\n.banner p{color:#f5e9f1;margin-top:9px;line-height:1.55}\n.layout{width:100%;max-width:1480px;margin:auto;padding:24px 34px 44px;display:grid;grid-template-columns:245px mi emove input[type=checkbox]{width:16px;height:16px;min-height:0}\n@media(max-width:650px){.section-head{align-items:start}.section-actions{justify-content:flex-end}.place-title{min-height:36px}.edit-grid{grid-template-columns:1fr}.detail-head-actions{flex-wrap:wrap;justify-content:flex-end}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader class=\"banner\">\n \u003cdiv class=\"banner-inner\">\n  \u003cdiv>\u003cdiv class=\"brand-line\">\u003cspan class=\"brand-mark\" aria-hidden=\"true\">\u003c/span>دلال · دليل حائل\u003c/div>\u003ch1>مراجعة الأماكن\u003c/h1>\u003cp>ابحثي عن منشأة، وعدّلي بياناتها أو علّميها بعد المراجعة.\u003c/p>\u003c/div>\n \u003c/div>\n\u003c/header>\n\u003cdiv class=\"layout\">\n \u003caside class=\"panel sidebar\" aria-label=\"الفئات\">\u003ch2>الفئات الرئيسية\u003c/h2>\u003cnav id=\"category-list\" class=\"category-list\">\u003c/nav>\u003c/aside>\n \u003cmain class=\"main-area\">\n  \u003cdiv class=\"stats\" aria-label=\"ملخص الفئة المختارة\">\n   \u003cdiv class=\"panel stat\">\u003cspan class=\"val\" id=\"total-stat\">\u003c/span>\u003cspan class=\"label\">الأماكن في الفئة\u003c/span>\u003c/div>\n   \u003cdiv class=\"panel stat\">\u003cspan class=\"val\" id=\"pending-stat\">\u003c/span>\u003cspan class=\"label\">بانتظار المراجعة\u003c/span>\u003c/div>\n   \u003cdiv class=\"panel stat\">\u003cspan class=\"val\" id=\"done-stat\">\u003c/span>\u003cspan class=\"label\">تمت المراجعة\u003c/span>\u003c/div>\n   \u003cdiv class=\"panel stat\">\u003cspan class=\"val\" id=\"follow-stat\">\u003c/span>\u003cspan class=\"label\">تحتاج استكمالًا\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003csection class=\"panel\" aria-labelledby=\"results-title\">\n   \u003cdiv class=\"toolbar\">\n    \u003cdiv class=\"control\">\u003clabel for=\"search\">البحث\u003c/label>\u003cinput type=\"search\" id=\"search\" placeholder=\"الاسم أو الرقم أو الإيميل\" autocomplete=\"off\">\u003c/div>\n    \u003cdiv class=\"control mobile-category\">\u003clabel for=\"category\">الفئة الرئيسية\u003c/label>\u003cselect id=\"category\">\u003c/select>\u003c/div>\n    \u003cdiv class=\"control\">\u003clabel for=\"subcategory\">الفئة الفرعية\u003c/label>\u003cselect id=\"subcategory\">\u003c/select>\u003c/div>\n    \u003cdiv class=\"control\">\u003clabel for=\"state\">حالة المراجعة\u003c/label>\u003cselect id=\"state\">\u003c/select>\u003c/div>\n   \u003c/div>\n   \u003cdiv class=\"section-head\">\u003cdiv>\u003ch2 id=\"results-title\">كل الأماكن\u003c/h2>\u003cp id=\"count\" class=\"results-count\" aria-live=\"polite\">\u003c/p>\u003c/div>\u003cdiv class=\"section-actions\">\u003cbutton class=\"action primary\" id=\"add-place\" type=\"button\">إضافة مكان\u003c/button>\u003cbutton class=\"action\" id=\"add-category\" type=\"button\">إضافة فئة\u003c/button>\u003cbutton class=\"action\" id=\"export\" type=\"button\">تنزيل CSV\u003c/button>\u003c/div>\u003c/div>\n   \u003cdiv class=\"table-wrap\" tabindex=\"0\" aria-label=\"جدول الأماكن\">\n    \u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">اسم المكان\u003c/th>\u003cth scope=\"col\">الفئة\u003c/th>\u003cth scope=\"col\">الموقع الإلكتروني\u003c/th>\u003cth scope=\"col\">التواصل\u003c/th>\u003cth scope=\"col\">المراجعة\u003c/th>\u003cth scope=\"col\">تم\u003c/th>\u003cth scope=\"col\">المراجع\u003c/th>\u003cth scope=\"col\">تعديل\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"results\">\u003c/tbody>\u003c/table>\n   \u003c/div>\n   \u003cdiv class=\"pagebar\">\u003cspan id=\"page-info\">\u003c/span>\u003cdiv class=\"page-buttons\">\u003cbutton class=\"action\" id=\"prev\" type=\"button\">السابق\u003c/button>\u003cbutton class=\"action\" id=\"next\" type=\"button\">التالي\u003c/button>\u003c/div>\u003c/div>\n  \u003c/section>\n  \u003cp id=\"change-notice\" class=\"footnote\" role=\"status\">\u003c/p>\n  \u003cp id=\"storage-note\" class=\"footnote\">التعديلات والفئات وحالة المراجعة مشتركة للجميع. راجعي تأكيد الحفظ في الشريط العلوي. تنزيل CSV يشمل السجلات المطابقة للفلاتر.\u003c/p>\n \u00 const loaded=new Set();
for(const key of Object.keys(pages)){
  document.getElementById(key).addEventListener('load',event=>{
    const doc=event.currentTarget.contentDocument;
    if(!doc||doc.URL!=='about:srcdoc')return;
    // Resolve each embedded page's section links inside its own document.
    doc.addEventListener('click',click=>{
      const link=click.target.closest('a[href^="#"]');
      if(!link)return;
      const target=doc.getElementById(link.getAttribute('href').slice(1));
      if(!target)return;
      click.preventDefault();
      target.scrollIntoView({block:'start'});
    });
  });
}
function showPage(){
  const current=location.hash==='#places'?'places':'project';
  for(const key of Object.keys(pages)){
    const frame=document.getElementById(key);
    const link=document.getElementById(key+'-link');
    frame.hidden=key!==current;
    if(key!==current){
      link.removeAttribute('aria-current');
      continue;
    }
    link.setAttribute('aria-current','page');
    if(!loaded.has(key)){
      frame.srcdoc=pages[key];
      loaded.add(key);
    }
  }
}
window.addEventListener('hashchange',showPage);
window.dalalSync.start(showPage);
